pr:
  branches:
    include:
      - dev

trigger: none

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  fetchDepth: 0
  
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'Install Dependencies'

- script: |
    npm run build
  displayName: 'Build React App'

- task: SonarCloudPrepare@3
  inputs:
    SonarCloud: 'SonarCloud'
    organization: 'konasatish4444'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'konasatish4444_python-sonar-demo'
    cliProjectName: 'python-sonar-demo'
    cliSources: '.'

- task: SonarCloudAnalyze@3
  displayName: 'Run Sonar Analysis'

- task: SonarCloudPublish@3
  inputs:
    pollingTimeoutSec: '300'
  displayName: 'Publish Quality Gate'